[package]
name = "ikigai-dev-server"
description = "A standalone, linkage-gated ikigai server for development tooling: git/gh/cargo + graphs + the browse family (persistent explanations/annotations), exec and llm rate-limited, over IPC."
# 0.3.0 was MINOR and not a patch for the same reason ikigai-browse 0.3.0 was:
# the RESOURCE NAMES this binary serves are its public interface, and the
# annotation family answered under a new one. A patch would ride a bare
# `cargo install` and take the old names out from under the mounts pointed at
# this socket.
#
# ★ 0.4.0 is MINOR on the second half of that rule, and it is worth spelling out
# because no name changes here at all. A mount reads a peer's endpoints through
# `Verb::Meta`, so what this binary publishes is not only the names but the
# CONTRACTS under them — and raising the `ikigai-llm` floor off the 0.10 line
# changes three of those, additively: every `urn:llm:*` input gains an ArgSpec
# `class` (so `urn:kernel:validate` can pre-flight it and `urn:kernel:actions`
# can narrow on it), four representations gain the `urn:llm:config` golden thread
# (so a mounted copy has something to cut), and `urn:llm:{p}:model` declares
# `urn:cap:net:*` when the provider names only a server. Nothing is removed and
# nothing that worked stops working, which is exactly what makes it a minor
# rather than either a patch or a break.
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-dev-server"

[[bin]]
name = "ikigai-dev"
path = "src/main.rs"

[dependencies]
# The Cargo.toml IS the module manifest: this binary links ONLY these — no
# EventKit, no calendar. A vulnerability in those can't be reached because they
# aren't compiled in. Linkage-gating, not config-gating. (ikigai-llm IS linked,
# deliberately — an outbound HTTP client to local inference, not the
# EventKit/TCC class the gating exists for; see src/llm.rs for the argument.)
# ★ EVERY FLOOR BELOW IS A TRUE MINIMUM, established by unpacking the published
# crates and finding the earliest version that carries the item this binary
# actually uses — not by starting at 0.1.0 and letting the caret sort it out.
# That distinction is not pedantry here. This manifest IS the module manifest,
# so a floor states what the server can SERVE, and `^` makes a too-low floor
# unfalsifiable: a lock already holding the old version satisfies it, cargo says
# nothing, and the gap surfaces only when something at RUNTIME asks for the
# resource that was never there. It cost two days of dead pull requests in the
# reading room (see ikigai-repo). A pin too HIGH fails instantly and locally; a
# pin too LOW is silent until it isn't. Only the low direction needs a rule.
#
# 0.1.67 is the true floor of this build, and it is not OURS: what this binary
# itself reaches for is still the 0.1.49 baseline (kernel-enforced declared
# `requires`). Two things push it up, and the second is the one that moved it
# from 0.1.56 to here:
#
# * ikigai-browse 0.3.0 pins `ikigai-core` 0.1.56 outright, and so does
#   `ikigai-a11y` 0.2.1 beneath it (`config::config_home` / `layered_paths_in`).
# * `ikigai-conformance` 0.1.0 — the dev-dependency behind `tests/conformance.rs`
#   — requires `^0.1.67`, and **cargo unifies `ikigai-core` across the whole
#   graph, dev-dependencies included**. One lock serves `cargo build` and
#   `cargo test` alike, so this is not a test-only floor: it is the version the
#   shipped binary links. A dev-dependency really can retune a production pin.
#
# A pin naming a version the graph cannot satisfy describes a build nobody has,
# so it states the real floor.
# ⚠ 0.1.63, where `Kernel::with_aliases` arrived, is now below the floor rather
# than deliberately excluded — but the decision it recorded stands: this server
# installs NO alias table. See the ikigai-browse note below for the argument.
ikigai-core = "0.1.67"
# urn:system:exec + urn:repo:* (the dev seam). ★ 0.1.5, and the four versions
# between it and the old `0.1.0` floor are the whole PR family:
#   0.1.3  urn:repo:pr:list, urn:repo:pr:diff   (absent in 0.1.2)
#   0.1.4  state= on the listing
#   0.1.5  urn:repo:pr:files, and path= on urn:repo:log
# ikigai-browse 0.3.0 does NOT depend on this crate at compile time — it
# resolves those facades THROUGH THE KERNEL at runtime, out of whatever space
# this manifest composed. So nothing in the dependency graph forces the version
# up, and `^0.1.0` was satisfied by a local lock holding 0.1.2. The binary
# installed from that lock served `urn:repo:{repo}:prs` and then failed inside
# it — "`urn:repo:pr:list` did not resolve" — for two days (2026-09-06→08),
# misread first as network slowness and then as a missing mount. With a true
# floor that lock could not have satisfied the manifest at all.
# 0.1.5 rather than the 0.1.3 that would have fixed that specific error:
# browse's SCOPED listing (`urn:repo:{repo}:prs:{path}`) intersects open PRs
# through `urn:repo:pr:files` and mines merged ones from `urn:repo:log path=`.
# Browse's own source names the requirement ("ikigai-repo >= 0.1.5"); the ArgSpec
# `path` and the `pr:files` binding both appear first in 0.1.5 and in no earlier
# published version.
ikigai-repo = "0.1.5"
# urn:rdf:* (graph ops). 0.1.3 first bound `urn:rdf:diff` and `urn:rdf:union`
# beside `urn:rdf:transrept`, but 0.1.4 is the floor because of what it puts in
# the MANIFOLD: it gives `urn:rdf:diff`'s `mode` an `one_of ["added","removed"]`
# and a `default_value`, where 0.1.3 had only prose. This binary's whole client
# surface is self-description over a socket, so an enumerated argument is a
# served fact, not a docstring — it is what `urn:kernel:actions` narrows on and
# what `urn:kernel:validate` pre-flights against.
ikigai-rdf = "0.1.4"
# urn:sparql:*. 0.1.6 exactly: `space_with_store`, `load_vocabulary`, and the
# `pub use oxigraph::store::Store` re-export src/browse.rs holds — all three
# appear first in 0.1.6 and none of them exists in 0.1.5. This is the
# shared-store seam (main.rs joins the explanation archive and the annotations
# into one graph), so nothing lower can even be typed.
ikigai-sparql = "0.1.6"
# 0.3.0 MOVES THE ANNOTATION NAMESPACE: `urn:annotation:` → `urn:iki:annotation:`
# (the ecosystem-wide `urn:iki:` migration; a MINOR bump because a module
# crate's resource NAMES are its public interface even with its Rust API
# untouched). Three consequences for this binary, two of them decisions:
#
# * NO ALIAS TABLE HERE, and no core bump to buy one. `Kernel::with_aliases`
#   arrived in core 0.1.63; this process is the SERVER side of an IPC socket,
#   and the client's kernel canonicalizes before the request crosses it — so
#   what arrives here is already `urn:iki:annotation:` and there is nothing to
#   translate. Tolerating an un-upgraded client would also buy nothing: the
#   alias wraps the ROOT, so the operator's `mount` lines sit inside it and
#   have to be hand-edited in the same window either way.
# * The a11y floor moves transitively — browse 0.3.0 pins `ikigai-a11y` 0.2.1
#   (the lock held 0.1.0), and 0.2.1 pins `ikigai-core` 0.1.56, the same floor
#   browse states outright. The `.app("dev-server")` layering in src/browse.rs
#   is unaffected.
# * 0.3.0 is therefore the true minimum here and not merely the current
#   release: `urn:iki:annotation` appears in no earlier published version
#   (0.2.15 and below bind `urn:annotation` only), and src/browse.rs has a test
#   asserting this process puts the new name on the wire and NOT the old one.
# * ⚠ STORED DATA DOES NOT MIGRATE ITSELF. Browse's listing paths
#   `strip_prefix` the STORED subject IRI, so annotations minted under the old
#   prefix are skipped rather than erroring — an empty list, not a failure.
#   This server owns the store, so the one-time rename is an operator step in
#   the same window; see README, "Upgrading a pre-0.3.0 store".
ikigai-browse = "0.3.0"     # urn:repo:{repo}:tree/file/…/explain/review + urn:iki:annotation:* + the PR family; 0.2.6 = review_* (0.2.5) and pr_* (0.2.6) ExplainConfig knobs we wire. 0.2.12 is the a11y floor: urn:repo:style reads its themes and contrast floor from the layered a11y.toml and lifts every sub-floor colour to the theme's own foreground. Below 0.2.11 it also leaked the light theme into dark mode, rendering parameters at 1.03:1. Stated so a stale cached index cannot resolve back past either. 0.2.14 raises the floor again and BOTH of those reasons still hold: 0.2.13 added `provider={iri}` on explain plus the `allow_provider`/`allow_providers` allowlist we feed from `browse.allow_model`, and 0.2.14 added the option menu beside the explain button — its panel resolves `urn:llm:models` once per open, which this binary binds because llm.rs mounts the whole ikigai-llm space alongside browse. 0.2.13 never reached crates.io, so 0.2.14 is the first released version carrying `provider=` at all.
# urn:llm:* — the explain seam's derivation engine. Everything llm.rs names in
# Rust (`space`, `Registry::from_json`, `Registry::single`, `OpenAiConfig::ollama`
# and its `caps` trait profile) has been there since 0.6.0; 0.10.0 added
# `urn:llm:{provider}:model`, the cheap "which model actually served this?" face
# that ikigai-browse resolves at derive time to stamp the true model id into an
# archived explanation's version tag — that is what `browse.review_model_label` /
# `browse.pr_model_label` OVERRIDE, and what they fall back to when unset. Below
# 0.10.0 that lookup misses and every derived artifact loses its provenance label.
#
# ★ 0.12.1, and note what the old `0.10.0` pin really was: under cargo's 0.x caret
# rule `^0.10.0` means `>=0.10.0, <0.11.0`, so a floor stated as a minimum was
# also a CEILING, and this binary served the 0.10 line of `urn:llm:*` for two
# minor releases after the ecosystem moved. That is worth stating because the
# floor doctrine one screen up only guards the LOW direction; on a 0.x dependency
# the same line silently guards the high one too, and nothing says so.
#
# 0.12.1 rather than the current 0.12.2, because the floor states the minimum
# that carries what this binary depends on, and what it depends on is 0.12.1's
# conformance adoption — verified by unpacking, not assumed:
#
# * THE REGISTRY GOLDEN THREAD. `urn:llm:config`, `:models`, `:select` and a
#   pinned provider's `:model` were `Expiry::Never` with an EMPTY thread set
#   through 0.12.0 — cached for the life of the daemon with nothing that could
#   ever cut them, and a copy cached on the far side of a mount could not be
#   invalidated at all. 0.12.1 hangs all four on `urn:llm:config`, so a host that
#   grows live reload cuts one thread and every derived representation
#   recomputes. `tests/conformance.rs::the_threads_a_mount_would_erase_are_enumerated`
#   asserts the exact thread names, so this is a pinned fact and not a hope.
# * Typed ArgSpecs on every `urn:llm:*` input, which is what this manifest is FOR:
#   the whole client surface here is self-description over a socket, and an input
#   with no class is one `urn:kernel:validate` cannot pre-flight and
#   `urn:kernel:actions` cannot narrow on. It took the composed walk's inherited
#   findings from 28 to 5 — every one of the 23 was `ikigai-llm`'s.
# * 0.11.0's "a provider may name the SERVER, not the model" and 0.12.0's load-shape
#   routing trait come along with it. ⚠ One served consequence, deliberate and
#   worth reading before writing an `llm.json`: `urn:llm:{p}:model` declares
#   `urn:cap:net:*` only in the DISCOVERING form (no pinned model); a pinned
#   provider declares nothing because it touches nothing. So this catalog's set of
#   capability-gated actions depends on the registry the operator configured.
#   `tests/enforced.rs` pins the ungated set for a PINNED fixture provider and says
#   so at its assertion.
#
# 0.12.2 is a vocabulary-tagging fix inside ikigai-llm's own graph face; nothing
# this binary serves declares an RDF face out of that crate, so it is not a floor.
ikigai-llm = "0.12.1"
# HttpTransport. 0.1.7 is where "a transport must NOT follow redirects — the
# ENDPOINT follows them, re-running the net-capability ACL against every hop"
# became the contract, and llm.rs's `ureq::builder().redirects(0)` is written to
# it. No earlier published version mentions redirects at all, so below 0.1.7
# `redirects(0)` means nobody follows them and every 3xx is handed back raw.
ikigai-http = "0.1.7"
# RateLimit overlay around the exec + repo + llm seams. Everything this binary
# uses is in the FIRST release, verified rather than assumed: `Rate::new`,
# `RateLimit::new` and the `.limit(prefix, rate)` builder, longest-prefix wins,
# `Verb::Meta` exempt, and the cap charged at RESOLUTION — which is what makes
# lib.rs's claim true that explain's internal `urn:llm:` subrequests are
# governed by the same budget.
#
# ⚠ And the floor is 0.1.8 all the same, because a floor states the minimum of a
# COMPILABLE set, not of an API. `ikigai-core` 0.1.60 gave `Resolved` a public
# `canonical` field, and every version of this crate through 0.1.7 builds a
# `Resolved { .. }` struct literal without it: against the core floor above,
# `ikigai-throttle` 0.1.0 fails with `error[E0063]: missing field `canonical` in
# initializer of `Resolved``, INSIDE a published dependency, with nothing in
# either manifest saying so. 0.1.8 is the first release that sets the field (and
# the first requiring core `^0.1.64`). Found by resolving this manifest from
# scratch with every ikigai pin written `=<floor>` — which is the only way to
# see it, since a caret resolve just picks 0.1.9 and says nothing.
ikigai-throttle = "0.1.8"
# serve over a Unix socket. 0.1.10 is where the version hello exists AT ALL:
# it is the first release importing `PROTOCOL_VERSION`, writing a `Hello`, and
# refusing a peer whose version differs. The comparison is EXACT EQUALITY
# (`hello.version == PROTOCOL_VERSION`), not a range, so a server below 0.1.10
# answers the handshake with a hang-up and every current client reports it as
# ancient. `PROTOCOL_VERSION` has been 7 since ikigai-wire 0.1.10 and is still 7
# at 0.1.19, so nothing this binary CALLS is above 0.1.10.
#
# ⚠ The floor is 0.1.18 for the transitive reason, and it is the same disease as
# the throttle pin one paragraph up, one level deeper: `ikigai-resolve` through
# 0.1.16 builds `Resolved { .. }` without `canonical` and therefore does not
# compile against the core floor above, and `ikigai-ipc` through 0.1.17 declares
# `ikigai-resolve = "^0.1.14"` — a range that ADMITS 0.1.14 and 0.1.16. So an ipc
# floor below 0.1.18 declares a set that is not guaranteed to compile at all: a
# fresh resolve happens to pick 0.1.19 and looks fine, and a lock that does not
# fails inside a published crate for reasons neither manifest mentions (the shape
# that cost ikigai-web #14 its window). 0.1.18 is the first release pinning
# `ikigai-resolve = "^0.1.18"`, so the admitted set is compilable by
# construction.
ikigai-ipc = "0.1.18"
# The meta renderer — and in a server this is not a formatting choice. EVERY
# Meta face goes through it: `Kernel::issue` calls `renderer.render(&description,
# &target)` and, for a type the renderer declines, transrepts the CANONICAL
# TURTLE to it. So this pin bounds what any client across this socket can
# possibly learn about what is bound here.
#
# ★ 0.1.47, not the old 0.1.33 — two distinct gaps, and the second one is the
# reason for the floor:
#
# * 0.1.34 adds `ik:oneOf`, `ik:default`, and the per-verb `ik:Action` /
#   `ik:action` nodes. 0.1.33 renders only
#   id/summary/verb/input/inputName/class/required/output/requires, so
#   `urn:rdf:diff`'s enumerated `mode` (the exact thing ikigai-rdf 0.1.4 is
#   pinned above to buy) never reaches the wire; explain's `provider` `one_of`
#   — the allow-list `browse.allow_model` configures — is invisible, so a remote
#   caller learns the accepted set only by being Denied; and ikigai-browse's
#   per-verb ActionSpecs have no `ik:Action` for the capability-scoped action
#   manifold to project.
# * ⚠ 0.1.47 adds the `application/json` Meta face, and WITHOUT IT REMOTE
#   NAMED-ARGUMENT ROUTING SILENTLY DIES. `ikigai-resolve`'s `MountedRemote`
#   asks a mounted endpoint to describe itself as `application/json` and
#   `serde_json::from_slice`s the answer. Below 0.1.47 the renderer declines
#   that type; the kernel looks for a `text/turtle` → `application/json`
#   transreptor, finds none (ikigai-rdf offers `application/ld+json`, which is
#   not the same media type, and ikigai-jsonld is deliberately not linked here),
#   and by contract HANDS BACK THE CANONICAL TURTLE. The client then parses
#   Turtle bytes as JSON, fails, and — because that parse is a `.ok()` — falls
#   back to a BARE `Description::new("remote")` with no inputs at all. Every
#   named argument through the mount is dropped: `dir=` on the PR facades,
#   `provider=` on explain, `as=` everywhere. No error anywhere. main.rs's
#   comment ("so the engine can route named args (e.g. dir=) to a remote
#   endpoint by its self-description") is only true from 0.1.47 up.
#
# Same disease as the ikigai-repo pin, one turn worse: there the composition
# raised an error, here it degrades to silence.
# Nothing this binary itself needs is above 0.1.47 — no endpoint linked here
# declares a `shape` (`ik:shape`, 0.1.53), and 0.1.66's `escape_iri_fragment`
# hardening covers ids and class IRIs that are all static and already valid in
# these crates. The floor is 0.1.66 for the same reason core's is 0.1.67:
# `ikigai-conformance` 0.1.0 requires `ikigai-vocab = "^0.1.66"`, cargo unifies
# it across the graph, and 0.1.66 is the first vocab release that requires core
# `^0.1.66` — so below it the declared set contradicts the core floor.
ikigai-vocab = "0.1.66"
# The persistence switch for the shared browse/sparql store: ikigai-browse and
# ikigai-sparql both keep oxigraph at default-features = false (no storage
# engine), and this feature-unifies Store::open onto the one shared Store type
# they all use — RocksDB, exclusive lock, the reason this server owns browse.
oxigraph = { version = "0.5", default-features = false, features = ["rocksdb"] }
async-trait = "0.1"         # the HttpTransport impl (blocking ureq under the async trait)
ureq = "2"                  # the native HTTP client behind urn:llm:*

[dev-dependencies]
# The module recipe as one test (`tests/conformance.rs`). ⚠ This is the pin that
# moved `ikigai-core` to 0.1.67 and `ikigai-vocab` to 0.1.66 above: cargo unifies
# a package across normal and dev dependencies, and one lock serves `cargo build`
# and `cargo test`, so a dev-dependency's floor is a PRODUCTION floor. Written
# `0.1.0` because that is what is on crates.io; the local main is ahead (an
# OUTPUTS check), and a pin no stranger can resolve is not a pin.
ikigai-conformance = "0.2.0"
futures = "0.3"             # block_on for the by-hand probes beside the suite
tempfile = "3"              # the scratch browse root and store
