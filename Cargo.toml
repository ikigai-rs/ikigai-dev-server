[package]
name = "ikigai-dev-server"
description = "A standalone, linkage-gated ikigai server for development tooling: git/gh/cargo + graphs, exec rate-limited, over IPC."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-dev-server"

[[bin]]
name = "ikigai-dev"
path = "src/main.rs"

[dependencies]
# The Cargo.toml IS the module manifest: this binary links ONLY these — no
# EventKit, no LLM backend, no calendar. A vulnerability in those can't be
# reached because they aren't compiled in. Linkage-gating, not config-gating.
ikigai-core = "0.1.39"
ikigai-repo = "0.1.0"       # urn:system:exec + urn:repo:* (the dev seam)
ikigai-rdf = "0.1.4"        # urn:rdf:* (graph ops)
ikigai-sparql = "0.1.1"     # urn:sparql:* (query)
ikigai-throttle = "0.1.0"   # RateLimit overlay around the exec seam
ikigai-ipc = "0.1.9"        # serve over a Unix socket
ikigai-vocab = "0.1.33"     # the Turtle meta renderer (describe / catalog)
